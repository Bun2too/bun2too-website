<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#d0ed9a" stroke-width="1.4"/></marker></defs><rect width="1440" height="900" fill="#10211c"/><text x="40" y="48" fill="#f1f0e6" font-size="32" font-family="Arial,Helvetica,sans-serif">Bun2Too · Publishing and delivery</text><text x="40" y="82" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Production uses master. Dev and QA use qa. Only published content reaches the site.</text><path d="M340 230H400" fill="none" stroke="#d0ed9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 230H800" fill="none" stroke="#d0ed9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1130 320V410" fill="none" stroke="#d0ed9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M800 500H720" fill="none" stroke="#d0ed9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M400 500H340" fill="none" stroke="#d0ed9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="140" width="300" height="180" rx="18" fill="#1b302a" stroke="#456352"/><text x="62" y="178" fill="#d0ed9a" font-size="23" font-family="Arial,Helvetica,sans-serif">Editor / migration</text><text x="62" y="216" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Author public content</text><text x="62" y="245" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Publish dependencies first</text><text x="62" y="274" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">CMA token: local admin only</text><rect x="400" y="140" width="320" height="180" rx="18" fill="#1b302a" stroke="#456352"/><text x="422" y="178" fill="#d0ed9a" font-size="23" font-family="Arial,Helvetica,sans-serif">Contentful environments</text><text x="422" y="216" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">master → production</text><text x="422" y="245" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">qa → dev and QA</text><text x="422" y="274" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Models + entries + artwork</text><rect x="800" y="140" width="530" height="180" rx="18" fill="#1b302a" stroke="#456352"/><text x="822" y="178" fill="#d0ed9a" font-size="23" font-family="Arial,Helvetica,sans-serif">Content Delivery API</text><text x="822" y="216" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Published content only</text><text x="822" y="245" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Delivery token held by the server</text><text x="822" y="274" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Fixed Contentful API host; no visitor data forwarded</text><rect x="800" y="410" width="530" height="180" rx="18" fill="#1b302a" stroke="#456352"/><text x="822" y="448" fill="#d0ed9a" font-size="23" font-family="Arial,Helvetica,sans-serif">Netlify / Next.js server</text><text x="822" y="486" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Resolve linked entries and validate content</text><text x="822" y="515" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Render approved React block components</text><text x="822" y="544" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">60-second revalidation; committed snapshot fallback</text><rect x="400" y="410" width="320" height="180" rx="18" fill="#1b302a" stroke="#456352"/><text x="422" y="448" fill="#d0ed9a" font-size="23" font-family="Arial,Helvetica,sans-serif">Server-rendered output</text><text x="422" y="486" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Page + metadata + schema</text><text x="422" y="515" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Public artwork URLs</text><text x="422" y="544" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">No CMS credential in HTML</text><rect x="40" y="410" width="300" height="180" rx="18" fill="#1b302a" stroke="#456352"/><text x="62" y="448" fill="#d0ed9a" font-size="23" font-family="Arial,Helvetica,sans-serif">Visitor browser</text><text x="62" y="486" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Established Bun2Too design</text><text x="62" y="515" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Interactive forms stay native</text><text x="62" y="544" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">No direct CDA/CMA calls</text><rect x="40" y="700" width="1290" height="140" rx="18" fill="#1b302a" stroke="#456352"/><text x="62" y="738" fill="#d0ed9a" font-size="23" font-family="Arial,Helvetica,sans-serif">Operational boundaries</text><text x="62" y="776" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Auth0, private inquiries, CAPTCHA, AI support, cookies, feeds and push keep their existing integration paths.</text><text x="62" y="805" fill="#d5e1db" font-size="18" font-family="Arial,Helvetica,sans-serif">Preview API is not enabled. Draft review uses the qa publishing workflow; the supplied preview key was rejected.</text></svg>